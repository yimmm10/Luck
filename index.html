<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Cosmic Tarot — ดูดวงไพ่ยิปซีจักรวาล</title>
    <meta name="description" content="สัมผัสประสบการณ์ดูดวงไพ่ยิปซีแบบโต้ตอบ ด้วยคำทำนายภาษาไทยเฉพาะด้าน ธีมห้วงอวกาศลึกลับ">
    <!-- Security: Content-Security-Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="no-referrer">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <!-- Animated Background -->
    <canvas id="starsCanvas" aria-hidden="true"></canvas>
    <div class="nebula-overlay" aria-hidden="true"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-wrap">
                <div class="logo-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <div class="logo-text">
                    <h1>COSMIC TAROT</h1>
                    <p class="subtitle">เปิดประตูสู่ความลี้ลับแห่งดวงดาว</p>
                </div>
            </div>
            <button id="soundToggle" class="icon-btn" title="เปิด/ปิดเสียง" aria-label="toggle sound">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </header>

        <main class="main-content" role="main">

            <!-- ═══════════════════════════════════════════ -->
            <!--  SCREEN 1 · CATEGORY & MODE SELECTION      -->
            <!-- ═══════════════════════════════════════════ -->
            <section id="screenHome" class="view active" aria-labelledby="homeTitle">
                <div class="glass-panel home-panel">
                    <h2 id="homeTitle" class="section-title">เลือกหัวข้อที่ต้องการคำทำนาย</h2>
                    <p class="section-desc">ทำจิตใจให้สงบ ตั้งสมาธิ แล้วเลือกเรื่องที่อยู่ในใจคุณ</p>

                    <!-- Category Grid -->
                    <div class="category-grid" role="group" aria-label="หัวข้อการทำนาย">
                        <button class="cat-card" data-topic="love" aria-label="ความรัก">
                            <div class="cat-icon"><i class="fa-solid fa-heart"></i></div>
                            <div class="cat-name">ความรัก</div>
                            <div class="cat-sub">Love &amp; Relationship</div>
                        </button>
                        <button class="cat-card" data-topic="work" aria-label="การงาน">
                            <div class="cat-icon"><i class="fa-solid fa-briefcase"></i></div>
                            <div class="cat-name">การงาน</div>
                            <div class="cat-sub">Career &amp; Work</div>
                        </button>
                        <button class="cat-card" data-topic="finance" aria-label="การเงิน">
                            <div class="cat-icon"><i class="fa-solid fa-coins"></i></div>
                            <div class="cat-name">การเงิน</div>
                            <div class="cat-sub">Finance &amp; Wealth</div>
                        </button>
                        <button class="cat-card" data-topic="health" aria-label="สุขภาพ">
                            <div class="cat-icon"><i class="fa-solid fa-heart-pulse"></i></div>
                            <div class="cat-name">สุขภาพ</div>
                            <div class="cat-sub">Health &amp; Wellbeing</div>
                        </button>
                    </div>

                    <!-- Mode Selector (shown after category picked) -->
                    <div id="modeSelector" class="mode-selector hidden" role="group" aria-label="จำนวนไพ่">
                        <p class="mode-label">เลือกจำนวนไพ่</p>
                        <div class="mode-buttons">
                            <button class="mode-btn active" data-mode="single">
                                <span class="mode-num">1</span>
                                <span class="mode-desc">ใบ — คำแนะนำ</span>
                            </button>
                            <button class="mode-btn" data-mode="triple">
                                <span class="mode-num">3</span>
                                <span class="mode-desc">ใบ — อดีต/ปัจจุบัน/อนาคต</span>
                            </button>
                        </div>
                        <button id="btnStartReading" class="btn btn-primary">
                            <i class="fa-solid fa-star"></i> เริ่มการทำนาย
                        </button>
                    </div>
                </div>
            </section>

            <!-- ═══════════════════════════════════════════ -->
            <!--  SCREEN 2 · BOARD (SHUFFLE + DRAW)         -->
            <!-- ═══════════════════════════════════════════ -->
            <section id="screenBoard" class="view" aria-labelledby="boardTitle">
                <div class="board-topbar">
                    <button id="btnBack" class="btn btn-ghost">
                        <i class="fa-solid fa-chevron-left"></i> ย้อนกลับ
                    </button>
                    <div id="boardStatus" class="board-status" aria-live="polite">
                        กดปุ่มสับไพ่เพื่อเริ่มต้น
                    </div>
                    <div id="topicBadge" class="topic-badge"></div>
                </div>

                <!-- Selected card slots -->
                <div id="slotsContainer" class="slots-container hidden">
                    <div id="slotsRow" class="slots-row"></div>
                </div>

                <!-- Deck pile -->
                <div id="deckZone" class="deck-zone">
                    <div id="deckPile" class="deck-pile"></div>
                </div>

                <!-- Fan spread -->
                <div id="fanZone" class="fan-zone hidden">
                    <div id="cardFan" class="card-fan"></div>
                </div>

                <!-- Actions -->
                <div class="board-actions">
                    <button id="btnShuffle" class="btn btn-glow">
                        <i class="fa-solid fa-rotate"></i> สับไพ่แห่งโชคชะตา
                    </button>
                    <button id="btnReveal" class="btn btn-reveal hidden">
                        <i class="fa-solid fa-eye"></i> เปิดเผยคำทำนาย
                    </button>
                </div>
            </section>

            <!-- ═══════════════════════════════════════════ -->
            <!--  SCREEN 3 · RESULTS                        -->
            <!-- ═══════════════════════════════════════════ -->
            <section id="screenResults" class="view" aria-labelledby="resultsTitle">
                <div class="results-wrap">
                    <h2 id="resultsTitle" class="results-title">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span id="resultsTitleText">ผลการทำนาย</span>
                    </h2>

                    <div id="resultsGrid" class="results-grid"></div>

                    <div id="synthPanel" class="synth-panel glass-panel hidden">
                        <h3><i class="fa-solid fa-scroll"></i> บทสรุปจากดวงดาว</h3>
                        <p id="synthText" class="synth-text"></p>
                    </div>

                    <div class="results-footer">
                        <button id="btnRestart" class="btn btn-primary">
                            <i class="fa-solid fa-rotate-right"></i> ทำนายใหม่อีกครั้ง
                        </button>
                    </div>
                </div>
            </section>

        </main>

        <footer class="app-footer">
            <p>© 2026 Cosmic Tarot · เพื่อความบันเทิงและแรงบันดาลใจในชีวิต</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="src/js/cards.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
